<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memoria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1d27;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
    .btn {
      display: block;
      background: #0d9488;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">✅</div>
    <h1 id="heading">Email confirmed!</h1>
    <p id="body">Your account is ready. Open Memoria to start your first adventure.</p>
    <a class="btn" id="open-btn" href="memoria://home">Open Memoria</a>
  </div>
  <script>
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const type = hash.get('type');
    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');

    if (type === 'recovery' && accessToken) {
      const fragment = 'access_token=' + accessToken +
        (refreshToken ? '&refresh_token=' + refreshToken : '') +
        '&type=recovery';
      const deepLink = 'memoria://reset-password#' + fragment;
      document.getElementById('emoji').textContent = '🔑';
      document.getElementById('heading').textContent = 'Reset your password';
      document.getElementById('body').textContent = 'Open Memoria to set a new password for your account.';
      document.getElementById('open-btn').href = deepLink;
      window.location = deepLink;
    } else {
      window.location = 'memoria://home';
    }
  </script>
</body>
</html>
