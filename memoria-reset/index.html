<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memoria — Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .app-name {
      font-size: 40px;
      font-weight: 800;
      color: #0d9488;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .card {
      background: #1a1d27;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .input-wrap {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      text-align: left;
    }
    input[type="password"] {
      width: 100%;
      background: #12141e;
      border: none;
      outline: none;
      padding: 15px 16px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    input[type="password"]::placeholder { color: #6b7280; }
    .error {
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .btn {
      display: block;
      background: #0d9488;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-name">Memoria</div>

  <div class="card" id="card-loading">
    <div class="spinner"></div>
    <h1>Loading…</h1>
  </div>

  <div class="card" id="card-form" style="display:none">
    <div class="emoji">🔑</div>
    <h1>Set new password</h1>
    <p>Choose a new password for your Memoria account.</p>
    <div class="input-wrap">
      <input type="password" id="pw1" placeholder="New password" autocomplete="new-password" />
    </div>
    <div class="input-wrap">
      <input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password" />
    </div>
    <p class="error" id="form-error"></p>
    <button class="btn" id="submit-btn">Update Password</button>
  </div>

  <div class="card" id="card-success" style="display:none">
    <div class="emoji">✅</div>
    <h1>Password updated!</h1>
    <p>Open Memoria and log in with your new password.</p>
    <a class="btn" href="memoria://home">Open Memoria</a>
  </div>

  <div class="card" id="card-expired" style="display:none">
    <div class="emoji">⏰</div>
    <h1>Link expired</h1>
    <p>This reset link has expired or already been used. Request a new one in the Memoria app.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://oaarhauiwawralqhrrlc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hYXJoYXVpd2F3cmFscWhycmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MjgyNjUsImV4cCI6MjA4OTUwNDI2NX0.z8FLzbTAw6UEXvsOVQjfadu_ABTX-hkwfS86yvm_79A';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function show(id) {
      ['card-loading','card-form','card-success','card-expired'].forEach(function(c) {
        document.getElementById(c).style.display = c === id ? 'block' : 'none';
      });
    }

    async function init() {
      var params = new URLSearchParams(window.location.search);
      var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));

      var code = params.get('code');
      var accessToken = hash.get('access_token');
      var refreshToken = hash.get('refresh_token');
      var type = hash.get('type');

      if (code) {
        var result = await client.auth.exchangeCodeForSession(code);
        if (result.error) { show('card-expired'); return; }
      } else if (accessToken && refreshToken && type === 'recovery') {
        var result = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (result.error) { show('card-expired'); return; }
      } else {
        show('card-expired');
        return;
      }

      show('card-form');
    }

    document.getElementById('submit-btn').addEventListener('click', async function() {
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;
      var errorEl = document.getElementById('form-error');

      errorEl.style.display = 'none';

      if (!pw1 || !pw2) {
        errorEl.textContent = 'Please fill in both fields.';
        errorEl.style.display = 'block';
        return;
      }
      if (pw1 !== pw2) {
        errorEl.textContent = 'Passwords don''t match.';
        errorEl.style.display = 'block';
        return;
      }
      if (pw1.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.textContent = 'Updating…';
      btn.disabled = true;

      var result = await client.auth.updateUser({ password: pw1 });
      if (result.error) {
        errorEl.textContent = result.error.message || 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
        btn.textContent = 'Update Password';
        btn.disabled = false;
        return;
      }

      show('card-success');
    });

    init();
  </script>
</body>
</html>
